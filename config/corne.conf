# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# --- Autonomie ---
# Deep sleep apres inactivite (desactive par defaut dans ZMK)
CONFIG_ZMK_SLEEP=y

# --- Bluetooth ---
# Puissance d'emission max sur nRF52840 : portee et stabilite du lien
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- HID ---
# Le keymap utilise des usages consumer > 0xFF (C_AC_SEARCH = 0x221,
# C_AC_DESKTOP_SHOW_ALL_WINDOWS = 0x29F). Sans FULL ils sont ignores
# silencieusement. C'est le defaut ZMK actuel, explicite ici pour s'en proteger.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
